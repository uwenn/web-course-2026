<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo-list</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <h1>Список задач</h1>

        <div class="add-form">
            <input type="text" id="task-input" placeholder="Новая задача...">
            <button id="add-btn">Добавить</button>
        </div>

        <div class="counters">
            <span id="counter">Осталось: 0, Выполнено: 0</span>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
