<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Симон говорит</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>

<body>

    <div class="app">
        <header class="head">
            <div class="head-top">
                <span class="serial">SYS/8842-X</span>
                <span class="status-dot">ONLINE</span>
            </div>
            <h1>SIMON SAYS</h1>
            <div class="head-bottom">
                <p class="sub">[ MEMORY_PROTOCOL ]</p>
                <span class="version">v1.0.4</span>
            </div>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-line"></div>
                <span class="stat-label">УРОВЕНЬ</span>
                <span class="stat-value" id="level">0</span>
                <div class="stat-footer">LVL_CURRENT</div>
            </div>
            <div class="stat">
                <div class="stat-line"></div>
                <span class="stat-label">РЕКОРД</span>
                <span class="stat-value" id="best">0</span>
                <div class="stat-footer">LVL_MAX</div>
            </div>
        </div>

        <div class="board-wrap">
            <div class="board">
                <div class="pad pad-green" data-index="0"><span class="pad-txt">A1</span></div>
                <div class="pad pad-red" data-index="1"><span class="pad-txt">B2</span></div>
                <div class="pad pad-yellow" data-index="2"><span class="pad-txt">C3</span></div>
                <div class="pad pad-blue" data-index="3"><span class="pad-txt">D4</span></div>
            </div>
            <div class="crosshair tl"></div>
            <div class="crosshair tr"></div>
            <div class="crosshair bl"></div>
            <div class="crosshair br"></div>
        </div>

        <div class="controls">
            <div class="message-box">
                <span class="msg-prefix">SYS.MSG ></span>
                <p id="message" class="message">НАЖМИ СТАРТ</p>
            </div>
            <button id="start-btn" class="start-btn">
                <span>ЗАПУСК</span>
            </button>
        </div>

        <footer class="footer">
            <div class="barcode"></div>
        </footer>
    </div>

</body>

</html>
