<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="desktop-icons">
        <div class="desktop-icon">
            <div class="icon-img"><span class="ico-trash"></span></div>
            <div class="icon-text">Корзина</div>
        </div>
        <div class="desktop-icon">
            <div class="icon-img"><span class="ico-pc"></span></div>
            <div class="icon-text">Этот компьютер</div>
        </div>
        <div class="desktop-icon">
            <div class="icon-img"><span class="ico-snake"></span></div>
            <div class="icon-text">Snake</div>
        </div>
    </div>

    <div class="win10-window">
        <div class="title-bar">
            <div class="title-left">
                <span class="ico-snake small"></span>
                <span>Snake</span>
            </div>
            <div class="window-controls">
                <button class="ctrl-btn">─</button>
                <button class="ctrl-btn">□</button>
                <button class="ctrl-btn">✕</button>
            </div>
        </div>

        <div class="game-content">
            <div class="game-hud">
                <div class="hud-item">
                    <span class="hud-label">СОБРАНО ФАЙЛОВ</span>
                    <span class="hud-value" id="score">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">РЕКОРД</span>
                    <span class="hud-value" id="best">0</span>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="game" width="1152" height="1152"></canvas>
                <div class="overlay" id="overlay">
                    <div class="dialog">
                        <div class="dialog-header">
                            <span id="dialog-icon" class="dialog-badge info">i</span>
                            <span id="dialog-title">Система</span>
                        </div>
                        <div class="dialog-body" id="dialog-text">
                            Добро пожаловать в Snake.<br>Управление: стрелки.
                        </div>
                        <div class="dialog-footer">
                            <button class="fluent-btn" id="start-btn">Запустить</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span>Готово</span>
            <span>1 элемент</span>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn">
            <div class="win-logo">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
        <div class="taskbar-search">
            <span class="ico-search"></span>
            <span>Поиск</span>
        </div>
        <div class="taskbar-app">
            <span class="ico-snake small"></span>
            <span>Snake</span>
        </div>
        <div class="taskbar-tray">
            <span class="ico-sound"></span>
            <span class="ico-net"></span>
            <span class="ico-bat"></span>
            <div class="tray-time">
                <span id="tray-time">12:00</span>
                <span id="tray-date">01.01.2026</span>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
